<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Compare – Text, DAX, M, SQL</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --text:#1d2330; --muted:#6b7280; --border:#dfe3ea; --accent:#2563eb; --accent-2:#1d4ed8;
  --del-bg:#fde8e8; --del-strong:#f5a9a9; --add-bg:#e2f6e7; --add-strong:#93dba6; --eq:#ffffff; --empty:#f0f1f4;
  --ln:#9aa1ad; --ok:#15803d; --ok-bg:#e7f6ec; --warn:#b45309; --warn-bg:#fff4e0; --flash:#fff3b0;
  --mono: Consolas, "Cascadia Code", "Cascadia Mono", Menlo, "DejaVu Sans Mono", monospace;
}
[data-theme="dark"]{
  --bg:#14161b; --panel:#1c1f26; --text:#e6e8ee; --muted:#9aa1ad; --border:#2e333d; --accent:#4f8cff; --accent-2:#6b9dff;
  --del-bg:#3a1f22; --del-strong:#7a2e35; --add-bg:#18331f; --add-strong:#2d6a3c; --eq:#1c1f26; --empty:#191c22;
  --ln:#5d6470; --ok:#4ade80; --ok-bg:#163222; --warn:#fbbf24; --warn-bg:#3a2e14; --flash:#4a4320;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap}
h1 span{color:var(--accent)}
select,button,label.chk{font:inherit}
select{max-width:200px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text)}
button{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent-2)}
.spacer{flex:1}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--empty);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none;color:var(--text);font-size:13px}
main{padding:12px 16px 40px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inputs.hidden{display:none}
.pane{background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.pane-head{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--border)}
.pane-head b{font-size:13px}
.pane-head .count{color:var(--muted);font-size:12px;margin-left:4px}
.pane-head button{padding:3px 8px;font-size:12px}
textarea{width:100%;min-height:220px;height:240px;resize:vertical;border:0;outline:0;padding:10px;background:transparent;color:var(--text);font:13px/1.45 var(--mono);tab-size:4;white-space:pre;overflow:auto;border-radius:0 0 8px 8px}
textarea.drag{background:var(--add-bg)}
.banner{margin:12px 0 8px;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.banner.same{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.banner .big{font-size:16px;font-weight:700}
.stat{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.dot.c{background:linear-gradient(90deg,var(--del-strong) 50%,var(--add-strong) 50%)}
.dot.a{background:var(--add-strong)} .dot.d{background:var(--del-strong)}
.warn{margin:6px 0;padding:8px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.navbar{display:flex;gap:8px;align-items:center;margin-left:auto}
details.changes{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:10px}
details.changes summary{cursor:pointer;padding:8px 12px;font-weight:600}
details.changes ol{margin:0;padding:4px 16px 10px 40px;max-height:260px;overflow:auto}
details.changes li{padding:3px 0;cursor:pointer}
details.changes li:hover{color:var(--accent)}
.chg-was{background:var(--del-bg);padding:0 4px;border-radius:3px;font-family:var(--mono);font-size:12.5px}
.chg-now{background:var(--add-bg);padding:0 4px;border-radius:3px;font-family:var(--mono);font-size:12.5px}
.diffwrap{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:calc(100vh - 140px)}
table.diff{border-collapse:collapse;width:100%;table-layout:fixed;font:13px/1.5 var(--mono)}
table.diff col.ln{width:52px} table.diff col.sg{width:22px}
table.diff th{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);text-align:left;padding:6px 8px;font:600 12px "Segoe UI",system-ui,sans-serif;color:var(--muted);z-index:2}
table.diff td{padding:0 8px;vertical-align:top;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere}
table.diff td.ln{color:var(--ln);text-align:right;user-select:none;padding-right:8px;border-right:1px solid var(--border);font-size:12px}
table.diff td.sg{color:var(--muted);text-align:center;user-select:none;padding:0}
table.diff td.c{min-height:1.5em}
table.diff td.mid{border-left:2px solid var(--border)}
td.del{background:var(--del-bg)} td.add{background:var(--add-bg)} td.empty{background:var(--empty)}
tr.gap td{background:var(--empty);color:var(--muted);text-align:center;font:12px "Segoe UI",system-ui,sans-serif;padding:3px;cursor:pointer}
tr.gap td:hover{color:var(--accent)}
.xd{background:var(--del-strong);border-radius:2px}
.xa{background:var(--add-strong);border-radius:2px}
tr.flash td{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 999px var(--flash)}100%{box-shadow:inset 0 0 0 999px transparent}}
.empty-msg{padding:40px;text-align:center;color:var(--muted)}
.help{color:var(--muted);font-size:12px}
kbd{font:11px var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--empty)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:.95}
@media (max-width:900px){.inputs{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Text Compare By <span> Nova</span></h1>
  <label class="help" for="lang">Type</label>
  <select id="lang" title="What kind of text is this?">
    <option value="auto">Auto detect</option>
    <option value="text">Plain text</option>
    <option value="dax">DAX</option>
    <option value="m">Power Query (M)</option>
    <option value="sql">SQL</option>
    <option value="python">Python</option>
    <option value="html">HTML / XML</option>
    <option value="json">JSON</option>
    <option value="other">Other code (no formatting)</option>
  </select>
  <span id="detected" class="badge">—</span>
  <button class="primary" id="btnCompare" title="Ctrl + Enter">Compare</button>
  <button id="btnFormat" title="Replace both boxes with the formatted version">Format both boxes</button>
  <button id="btnSwap" title="Swap left and right">⇄ Swap</button>
  <button id="btnClear">Clear</button>
  <span class="spacer"></span>
  <select id="example" title="Load an example">
    <option value="">Load example…</option>
    <option value="dax">DAX example</option>
    <option value="m">M query example</option>
    <option value="sql">SQL example</option>
    <option value="text">Text example</option>
  </select>
  <button id="btnInputs" title="Show or hide the input boxes">Hide inputs</button>
  <button id="btnTheme" title="Light / dark">🌓</button>
</header>
<div class="opts">
  <label class="chk"><input type="checkbox" id="optAuto" checked> Compare automatically</label>
  <label class="chk"><input type="checkbox" id="optFormat" checked> Format before compare</label>
  <label class="chk"><input type="checkbox" id="optCase"> Ignore case</label>
  <label class="chk"><input type="checkbox" id="optWs"> Ignore spaces</label>
  <label class="chk"><input type="checkbox" id="optBlank" checked> Ignore blank lines</label>
  <label class="chk"><input type="checkbox" id="optComments"> Ignore comments</label>
  <label class="chk"><input type="checkbox" id="optOnly"> Show only differences</label>
  <label class="chk">View
    <select id="view"><option value="side">Side by side</option><option value="inline">One column</option></select>
  </label>
  <span class="help">Tip: <kbd>Ctrl</kbd>+<kbd>Enter</kbd> compare · drop a file on a box to load it · <kbd>Alt</kbd>+<kbd>↓</kbd>/<kbd>↑</kbd> next/prev difference</span>
</div>
<main>
  <section class="inputs" id="inputs">
    <div class="pane">
      <div class="pane-head">
        <b>Left (old / original)</b><span class="count" id="cntL"></span>
        <span class="spacer"></span>
        <button data-open="left">Open file</button>
        <button data-copy="left" title="Copy the formatted version">Copy formatted</button>
      </div>
      <textarea id="left" spellcheck="false" placeholder="Paste the first text or code here…"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head">
        <b>Right (new / changed)</b><span class="count" id="cntR"></span>
        <span class="spacer"></span>
        <button data-open="right">Open file</button>
        <button data-copy="right" title="Copy the formatted version">Copy formatted</button>
      </div>
      <textarea id="right" spellcheck="false" placeholder="Paste the second text or code here…"></textarea>
    </div>
  </section>
  <input type="file" id="fileInput" hidden>
  <div id="warns"></div>
  <div id="banner" class="banner"><span class="help">Paste text or code in both boxes. The result shows here.</span></div>
  <details class="changes" id="changes" hidden open><summary id="changesTitle">List of changes</summary><ol id="changeList"></ol></details>
  <div class="diffwrap" id="diffwrap"><div class="empty-msg">Nothing to compare yet.</div></div>
</main>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= Code Compare engine: formatters + diff ================= */
const INDENT = '    ';
const WIDTH = 80;

const DAX_KW = new Set(['VAR','RETURN','IN','NOT','AND','OR','TRUE','FALSE','ASC','DESC','DEFINE','EVALUATE','MEASURE','ORDER','BY','START','AT','COLUMN','TABLE']);
const DAX_STRUCT = new Set(['VAR','RETURN','IN','ORDER','BY','START','AT','ASC','DESC','DEFINE','EVALUATE','MEASURE','AND','OR']);
const M_KW = new Set(['let','in','each','if','then','else','try','otherwise','catch','and','or','not','type','meta','as','is','true','false','null','section','shared','error','table','record','list','nullable','function']);
const SQL_KW = new Set(('SELECT FROM WHERE AND OR NOT IN IS NULL AS ON JOIN INNER LEFT RIGHT FULL OUTER CROSS GROUP BY ORDER HAVING ' +
  'UNION ALL DISTINCT TOP LIMIT OFFSET FETCH NEXT ROWS ROW ONLY INSERT INTO VALUES UPDATE SET DELETE CREATE ALTER DROP TABLE VIEW ' +
  'INDEX PROCEDURE PROC FUNCTION RETURNS RETURN BEGIN END CASE WHEN THEN ELSE EXISTS BETWEEN LIKE ILIKE WITH OVER PARTITION ASC DESC ' +
  'NULLS FIRST LAST PRIMARY KEY FOREIGN REFERENCES DEFAULT CONSTRAINT UNIQUE CHECK IF DECLARE EXEC EXECUTE MERGE USING MATCHED ' +
  'TRUNCATE QUALIFY WINDOW INTERSECT EXCEPT MINUS APPLY RECURSIVE LATERAL TRUE FALSE ANY SOME TEMP TEMPORARY REPLACE GO ' +
  'RANGE UNBOUNDED PRECEDING FOLLOWING CURRENT PIVOT UNPIVOT FOR NOLOCK').split(' '));
const SQL_FUNCS = new Set(('COUNT SUM AVG MIN MAX COALESCE ISNULL IFNULL NVL NVL2 NULLIF CAST CONVERT TRY_CAST TRY_CONVERT ROUND FLOOR ' +
  'CEILING CEIL ABS UPPER LOWER TRIM LTRIM RTRIM SUBSTRING SUBSTR LEFT RIGHT LEN LENGTH REPLACE CONCAT CONCAT_WS CHARINDEX ' +
  'POSITION INSTR DATEADD DATEDIFF DATEPART DATENAME DATE_TRUNC DATE_PART EXTRACT GETDATE SYSDATE CURRENT_DATE CURRENT_TIMESTAMP NOW ' +
  'YEAR MONTH DAY FORMAT TO_DATE TO_CHAR TO_NUMBER TO_VARCHAR TO_TIMESTAMP ROW_NUMBER RANK DENSE_RANK NTILE LAG LEAD FIRST_VALUE ' +
  'LAST_VALUE STRING_AGG LISTAGG GROUP_CONCAT IIF IF IFF DECODE SPLIT_PART REGEXP_REPLACE REGEXP_SUBSTR GREATEST LEAST POWER SQRT ' +
  'MOD ARRAY_AGG OBJECT_CONSTRUCT PARSE_JSON FLATTEN ZEROIFNULL DIV0 DATEFROMPARTS EOMONTH ISNUMERIC STUFF PATINDEX REVERSE ' +
  'REPLICATE SPACE STR CHAR ASCII SIGN EXP LOG PERCENTILE_CONT MEDIAN STDDEV VARIANCE DATE TIME TIMESTAMP').split(' '));

/* ---------------- Tokenizer (DAX / M / SQL) ---------------- */
function tokenize(src, lang) {
  const toks = [], n = src.length;
  let i = 0;
  const push = (t, v) => toks.push({ t, v });
  const readQ = (start, q) => { let j = start + 1; while (j < n) { if (src[j] === q) { if (src[j + 1] === q) { j += 2; continue; } return j + 1; } j++; } return n; };
  const readBr = (start) => { let j = start + 1; while (j < n) { if (src[j] === ']') { if (src[j + 1] === ']') { j += 2; continue; } return j + 1; } j++; } return n; };
  const reNum = /(?:\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+(?:[eE][+-]?\d+)?)/y;
  const reWord = lang === 'sql' ? /[\p{L}_@#$][\p{L}\p{N}_@#$]*/uy
    : lang === 'm' ? /[\p{L}_#][\p{L}\p{N}_.]*/uy : /[\p{L}_][\p{L}\p{N}_.]*/uy;
  const OPS3 = ['...'];
  const OPS2 = ['<=', '>=', '<>', '!=', '==', '&&', '||', '=>', ':=', '::', '??', '..', '->', '+=', '-=', '*=', '/='];
  while (i < n) {
    const c = src[i], c2 = src.substr(i, 2);
    if (/\s/.test(c)) { i++; continue; }
    if (c2 === '/*') { let j = src.indexOf('*/', i + 2); j = j < 0 ? n : j + 2; push('bcomment', src.slice(i, j)); i = j; continue; }
    if ((c2 === '//' && lang !== 'sql') || (c2 === '--' && lang !== 'm')) {
      let j = src.indexOf('\n', i); if (j < 0) j = n; push('lcomment', src.slice(i, j).trimEnd()); i = j; continue;
    }
    if (lang === 'm' && c2 === '#"') { const j = readQ(i + 1, '"'); push('ident', src.slice(i, j)); i = j; continue; }
    if (c === '"') { const j = readQ(i, '"'); push(lang === 'sql' ? 'ident' : 'str', src.slice(i, j)); i = j; continue; }
    if (c === "'") { const j = readQ(i, "'"); push(lang === 'dax' ? 'ident' : 'str', src.slice(i, j)); i = j; continue; }
    if (c === '[' && lang === 'dax') { const j = readBr(i); push('col', src.slice(i, j)); i = j; continue; }
    if (c === '[' && lang === 'sql') { const j = readBr(i); push('ident', src.slice(i, j)); i = j; continue; }
    if (c === '`' && lang === 'sql') { const j = readQ(i, '`'); push('ident', src.slice(i, j)); i = j; continue; }
    if (/\d/.test(c) || (c === '.' && /\d/.test(src[i + 1] || ''))) {
      reNum.lastIndex = i; const m = reNum.exec(src);
      if (m && m[0]) { push('num', m[0]); i += m[0].length; continue; }
    }
    reWord.lastIndex = i; const w = reWord.exec(src);
    if (w && w[0]) {
      const v = w[0], U = v.toUpperCase();
      let t = 'word';
      if (lang === 'dax' && DAX_KW.has(U)) t = 'kw';
      else if (lang === 'sql' && SQL_KW.has(U)) t = 'kw';
      else if (lang === 'm' && M_KW.has(v)) t = 'kw';
      push(t, v); i += v.length; continue;
    }
    if (c === '(' || c === '{' || (c === '[' && lang === 'm')) { push('open', c); i++; continue; }
    if (c === ')' || c === '}' || c === ']') { push('close', c); i++; continue; }
    if (c === ',') { push('comma', c); i++; continue; }
    if (c === ';') { push('semi', c); i++; continue; }
    if (c === '.' ) { push('dot', c); i++; continue; }
    const s3 = src.substr(i, 3);
    if (OPS3.includes(s3)) { push('op', s3); i += 3; continue; }
    if (OPS2.includes(c2)) { push('op', c2); i += 2; continue; }
    push('op', c); i++;
  }
  return toks;
}

/* Merge multi-word SQL keywords like GROUP BY, LEFT OUTER JOIN */
const SQL_PHRASES = ['LEFT OUTER JOIN', 'RIGHT OUTER JOIN', 'FULL OUTER JOIN', 'LEFT JOIN', 'RIGHT JOIN', 'FULL JOIN', 'INNER JOIN',
  'CROSS JOIN', 'CROSS APPLY', 'OUTER APPLY', 'GROUP BY', 'ORDER BY', 'PARTITION BY', 'UNION ALL', 'INSERT INTO', 'DELETE FROM',
  'MERGE INTO', 'WHEN NOT MATCHED', 'WHEN MATCHED'].map(p => p.split(' ')).sort((a, b) => b.length - a.length);
function mergeSqlPhrases(toks) {
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    let merged = false;
    for (const ph of SQL_PHRASES) {
      let ok = true;
      for (let k = 0; k < ph.length; k++) {
        const t = toks[i + k];
        if (!t || (t.t !== 'kw' && t.t !== 'word') || t.v.toUpperCase() !== ph[k]) { ok = false; break; }
      }
      if (ok) { out.push({ t: 'kw', v: ph.join(' ') }); i += ph.length - 1; merged = true; break; }
    }
    if (!merged) out.push(toks[i]);
  }
  return out;
}

/* ---------------- Parser: builds nested groups ---------------- */
function parse(toks, opts) {
  let p = 0;
  const CLOSE = { '(': ')', '{': '}', '[': ']' };
  const lang = opts.lang;
  const isStop = (t, stops) =>
    (t.t === 'comma' && stops.has(',')) || (t.t === 'close' && stops.has(t.v)) ||
    (opts.mLet && t.t === 'kw' && t.v === 'in' && stops.has('in'));

  function finish(out) {
    for (let k = 0; k < out.length; k++) {
      const it = out[k], nx = out[k + 1], pv = out[k - 1];
      if ((it.t === 'word' || it.t === 'kw') && nx && nx.t === 'group' && nx.open === '(') {
        if (it.t === 'word') it.t = 'func';
        else {
          const U = it.v.toUpperCase();
          if (lang === 'dax' && !DAX_STRUCT.has(U)) it.t = 'func';
          else if (lang === 'sql' && SQL_FUNCS.has(U)) it.t = 'func';
        }
      }
      if (it.t === 'op' && /^[-+!~]$/.test(it.v))
        it.unary = !pv || pv.t === 'op' || pv.t === 'comma' || pv.t === 'kw' || pv.t === 'lcomment' || pv.t === 'semi';
    }
    return out;
  }
  function parseSeq(stops) {
    const out = [];
    while (p < toks.length) {
      const t = toks[p];
      if (isStop(t, stops)) break;
      if (t.t === 'open') { p++; out.push(parseGroup(t.v, CLOSE[t.v])); continue; }
      if (opts.mLet && t.t === 'kw' && t.v === 'let') { p++; out.push(parseLet(stops)); continue; }
      out.push(t); p++;
    }
    return finish(out);
  }
  function parseGroup(open, close) {
    const items = [];
    const stops = new Set([close]);
    if (opts.splitCommas) stops.add(',');
    for (;;) {
      items.push(parseSeq(stops));
      const t = toks[p];
      if (!t) return { t: 'group', open, close: '', items };
      p++;
      if (t.t === 'comma') continue;
      return { t: 'group', open, close, items };
    }
  }
  function parseLet(parentStops) {
    const items = [];
    const stops = new Set(['in', ',']);
    for (;;) {
      items.push(parseSeq(stops));
      const t = toks[p];
      if (!t) return { t: 'let', items, body: [], hasIn: false };
      p++;
      if (t.t === 'comma') continue;
      return { t: 'let', items, body: parseSeq(parentStops), hasIn: true };
    }
  }
  const all = [];
  while (p < toks.length) {
    all.push(...parseSeq(new Set()));
    if (p < toks.length) { all.push(toks[p]); p++; } // stray closer / 'in'
  }
  return finish(all);
}

/* ---------------- Layout helpers ---------------- */
function tokText(it, lang) {
  if (it.t === 'kw') return lang === 'm' ? it.v : it.v.toUpperCase();
  if (it.t === 'func') {
    if (lang === 'dax') return it.v.toUpperCase();
    if (lang === 'sql' && SQL_FUNCS.has(it.v.toUpperCase())) return it.v.toUpperCase();
  }
  return it.v;
}
function needSpace(p, it) {
  if (!p) return false;
  if (it.t === 'comma' || it.t === 'semi' || it.t === 'dot' || it.t === 'close') return false;
  if (p.t === 'dot') return false;
  if (p.t === 'op' && (p.unary || p.v === '::')) return false;
  if (it.t === 'op' && it.v === '::') return false;
  if (it.t === 'group') return !(p.t === 'func' || p.t === 'word' || p.t === 'ident' || p.t === 'col' || p.t === 'group');
  if (it.t === 'col') return !(p.t === 'word' || p.t === 'ident' || p.t === 'func');
  return true;
}
const trimItems = items => (items.length > 1 && items[items.length - 1].length === 0) ? items.slice(0, -1) : items;
const DAX_BREAK = new Set(['VAR', 'RETURN', 'EVALUATE', 'DEFINE', 'MEASURE']);

function flatSeq(seq, lang) {
  let s = '', prev = null;
  for (const it of seq) {
    if (it.t === 'lcomment' || it.t === 'let') return null;
    if (lang === 'dax' && it.t === 'kw' && DAX_BREAK.has(it.v.toUpperCase())) return null;
    let txt;
    if (it.t === 'group') { txt = flatGroup(it, lang); if (txt === null) return null; }
    else txt = tokText(it, lang);
    if (needSpace(prev, it)) s += ' ';
    s += txt; prev = it;
  }
  return s;
}
function flatGroup(g, lang) {
  const parts = [];
  for (const sq of trimItems(g.items)) { const f = flatSeq(sq, lang); if (f === null) return null; parts.push(f); }
  return g.open + parts.join(', ') + g.close;
}

const LANG_NAME = { text: 'Plain text', dax: 'DAX', m: 'Power Query (M)', sql: 'SQL', python: 'Python', html: 'HTML / XML', json: 'JSON', other: 'Other code' };
const OPT_IDS = ['optAuto', 'optFormat', 'optCase', 'optWs', 'optBlank', 'optComments', 'optOnly'];
const state = { hunks: [], cur: -1, formatted: { left: '', right: '' }, lang: 'text', expandAll: false };

const store = {
  get(k, d) { try { const v = localStorage.getItem('cc_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cc_' + k, JSON.stringify(v)); } catch (e) { /* storage not available */ } }
};

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600); }
function getOpts() {
  return { lang: $('lang').value, auto: $('optAuto').checked, format: $('optFormat').checked, ignoreCase: $('optCase').checked,
    ignoreWs: $('optWs').checked, ignoreBlank: $('optBlank').checked, ignoreComments: $('optComments').checked,
    onlyDiff: $('optOnly').checked, view: $('view').value };
}
function saveAll() {
  const o = getOpts(); store.set('opts', o);
  store.set('left', $('left').value.length < 2e6 ? $('left').value : ''); store.set('right', $('right').value.length < 2e6 ? $('right').value : '');
}
function loadAll() {
  const o = store.get('opts', null);
  if (o) {
    $('lang').value = o.lang || 'auto'; $('view').value = o.view || 'side';
    const map = { optAuto: 'auto', optFormat: 'format', optCase: 'ignoreCase', optWs: 'ignoreWs', optBlank: 'ignoreBlank', optComments: 'ignoreComments', optOnly: 'onlyDiff' };
    for (const id of OPT_IDS) if (typeof o[map[id]] === 'boolean') $(id).checked = o[map[id]];
  }
  $('left').value = store.get('left', ''); $('right').value = store.get('right', '');
  document.documentElement.dataset.theme = store.get('theme', (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
}
function lineCount(s) { return s ? s.split('\n').length : 0; }
function updateCounts() { $('cntL').textContent = lineCount($('left').value) + ' lines'; $('cntR').textContent = lineCount($('right').value) + ' lines'; }

function pickLang(o, left, right) {
  if (o.lang !== 'auto') return o.lang;
  const a = detectLang(left), b = detectLang(right);
  if (a && a !== 'text') return a;
  if (b && b !== 'text') return b;
  return 'text';
}
function prepare() {
  const o = getOpts();
  const left = $('left').value, right = $('right').value;
  const lang = pickLang(o, left, right);
  const warns = [];
  let L, R;
  if (o.format && lang !== 'other') {
    const fl = formatCode(left, lang, o), fr = formatCode(right, lang, o);
    L = fl.text; R = fr.text;
    if (fl.error) warns.push('Left side: ' + fl.error + '.');
    if (fr.error) warns.push('Right side: ' + fr.error + '.');
  } else {
    L = formatCode(left, 'text', o).text; R = formatCode(right, 'text', o).text;
  }
  return { o, lang, L, R, warns };
}

function runCompare() {
  saveAll(); updateCounts();
  const { o, lang, L, R, warns } = prepare();
  state.formatted = { left: L, right: R }; state.lang = lang;
  $('detected').textContent = (o.lang === 'auto' ? 'Detected: ' : '') + LANG_NAME[lang] + (o.format && lang !== 'other' ? ' · formatted' : '');
  $('warns').innerHTML = warns.map(w => '<div class="warn">⚠ ' + escHtml(w) + '</div>').join('');
  if (!$('left').value.trim() && !$('right').value.trim()) {
    $('banner').className = 'banner'; $('banner').innerHTML = '<span class="help">Paste text or code in both boxes. The result shows here.</span>';
    $('changes').hidden = true; $('diffwrap').innerHTML = '<div class="empty-msg">Nothing to compare yet.</div>'; return;
  }
  const rows = compareTexts(L, R, o);
  render(rows, o);
}

function render(rows, o) {
  let chg = 0, add = 0, del = 0, eq = 0;
  const hunks = [];
  rows.forEach((r, i) => {
    if (r.type === 'eq') { eq++; return; }
    if (r.type === 'chg') chg++; else if (r.type === 'add') add++; else del++;
    if (i === 0 || rows[i - 1].type === 'eq') hunks.push({ start: i, end: i }); else hunks[hunks.length - 1].end = i;
  });
  state.hunks = hunks; state.cur = -1;
  const nL = rows.filter(r => r.l).length, nR = rows.filter(r => r.r).length;
  const simPct = (nL + nR) ? Math.round(200 * eq / (nL + nR)) : 100;

  // inline word diffs for changed rows
  const inl = rows.map(r => r.type === 'chg' ? inlineDiff(r.l.t, r.r.t, o) : null);

  // banner
  const ignored = [o.ignoreCase && 'case', o.ignoreWs && 'spaces', o.ignoreBlank && 'blank lines', o.ignoreComments && 'comments'].filter(Boolean);
  const note = (o.format && state.lang !== 'other' ? 'Both sides formatted as ' + LANG_NAME[state.lang] + '. ' : '') + (ignored.length ? 'Ignoring ' + ignored.join(', ') + '.' : '');
  const b = $('banner');
  if (!hunks.length) {
    b.className = 'banner same';
    b.innerHTML = '<span class="big">✅ Same: no differences found</span><span class="help" style="color:inherit">' + escHtml(note) + '</span>';
  } else {
    b.className = 'banner';
    b.innerHTML =
      '<span class="big">❗ ' + hunks.length + ' difference' + (hunks.length > 1 ? 's' : '') + ' found</span>' +
      '<span class="stat"><i class="dot c"></i>' + chg + ' changed line' + (chg === 1 ? '' : 's') + '</span>' +
      '<span class="stat"><i class="dot a"></i>' + add + ' added (only in right)</span>' +
      '<span class="stat"><i class="dot d"></i>' + del + ' removed (only in left)</span>' +
      '<span class="stat">≈ ' + simPct + '% same</span>' +
      '<span class="help">' + escHtml(note) + '</span>' +
      '<span class="navbar"><button id="btnPrev" title="Alt + ↑">▲ Prev</button><span id="navPos" class="help">– / ' + hunks.length + '</span><button id="btnNext" title="Alt + ↓">▼ Next</button></span>';
    $('btnPrev').onclick = () => go(state.cur - 1);
    $('btnNext').onclick = () => go(state.cur + 1);
  }

  // list of changes
  const list = [];
  hunks.slice(0, 300).forEach((h, k) => {
    const part = rows.slice(h.start, h.end + 1);
    const ls = part.filter(r => r.l).map(r => r.l.n), rs = part.filter(r => r.r).map(r => r.r.n);
    const rng = a => !a.length ? '' : a[0] === a[a.length - 1] ? 'line ' + a[0] : 'lines ' + a[0] + '–' + a[a.length - 1];
    let txt;
    const c = part.filter(r => r.type === 'chg').length, a = part.filter(r => r.type === 'add').length, d = part.filter(r => r.type === 'del').length;
    if (part.length === 1 && part[0].type === 'chg') {
      const x = inl[h.start];
      const cut = s => s.length > 70 ? s.slice(0, 70) + '…' : s;
      const was = x.removed.join(' … '), now = x.added.join(' … ');
      txt = 'Left ' + rng(ls) + ' / Right ' + rng(rs) + ': ' +
        (was ? 'was <span class="chg-was">' + escHtml(cut(was)) + '</span> ' : '') +
        (now ? (was ? '→ now ' : 'added ') + '<span class="chg-now">' + escHtml(cut(now)) + '</span>' : (was ? '(removed)' : 'spacing / case only'));
    } else {
      const bits = [c && c + ' changed', a && a + ' added', d && d + ' removed'].filter(Boolean).join(', ');
      txt = (ls.length ? 'Left ' + rng(ls) : '') + (ls.length && rs.length ? ' / ' : '') + (rs.length ? 'Right ' + rng(rs) : '') + ': ' + bits;
    }
    list.push('<li data-h="' + k + '">' + txt + '</li>');
  });
  $('changes').hidden = !hunks.length;
  $('changesTitle').textContent = 'List of changes (' + hunks.length + ')' + (hunks.length > 300 ? ' (first 300 shown)' : '');
  $('changeList').innerHTML = list.join('');

  // which rows to show
  const keep = new Array(rows.length).fill(!o.onlyDiff || state.expandAll);
  if (o.onlyDiff && !state.expandAll) rows.forEach((r, i) => { if (r.type !== 'eq') for (let z = Math.max(0, i - 3); z <= Math.min(rows.length - 1, i + 3); z++) keep[z] = true; });

  const hunkStart = new Map(hunks.map((h, k) => [h.start, k]));
  const out = [];
  const side = o.view === 'side';
  const cols = side ? 4 : 4;
  if (side) out.push('<table class="diff"><colgroup><col class="ln"><col><col class="ln"><col></colgroup><thead><tr><th colspan="2">Left (old)</th><th colspan="2" class="mid">Right (new)</th></tr></thead><tbody>');
  else out.push('<table class="diff"><colgroup><col class="ln"><col class="ln"><col class="sg"><col></colgroup><thead><tr><th>Left</th><th>Right</th><th></th><th>Text</th></tr></thead><tbody>');
  let hidden = 0;
  const flushGap = () => { if (hidden) { out.push('<tr class="gap"><td colspan="' + cols + '" title="Click to show all lines">··· ' + hidden + ' same line' + (hidden > 1 ? 's' : '') + ' hidden (click to show) ···</td></tr>'); hidden = 0; } };
  const e = s => escHtml(s);
  for (let i = 0; i < rows.length; i++) {
    if (!keep[i]) { hidden++; continue; }
    flushGap();
    const r = rows[i];
    const id = hunkStart.has(i) ? ' id="h' + hunkStart.get(i) + '"' : '';
    if (side) {
      if (r.type === 'eq') out.push('<tr' + id + '><td class="ln">' + r.l.n + '</td><td class="c">' + e(r.l.t) + '</td><td class="ln mid">' + r.r.n + '</td><td class="c">' + e(r.r.t) + '</td></tr>');
      else if (r.type === 'chg') out.push('<tr' + id + '><td class="ln del">' + r.l.n + '</td><td class="c del">' + inl[i].la + '</td><td class="ln add mid">' + r.r.n + '</td><td class="c add">' + inl[i].lb + '</td></tr>');
      else if (r.type === 'del') out.push('<tr' + id + '><td class="ln del">' + r.l.n + '</td><td class="c del">' + e(r.l.t) + '</td><td class="ln empty mid"></td><td class="c empty"></td></tr>');
      else out.push('<tr' + id + '><td class="ln empty"></td><td class="c empty"></td><td class="ln add mid">' + r.r.n + '</td><td class="c add">' + e(r.r.t) + '</td></tr>');
    } else {
      if (r.type === 'eq') out.push('<tr' + id + '><td class="ln">' + r.l.n + '</td><td class="ln">' + r.r.n + '</td><td class="sg"></td><td class="c">' + e(r.l.t) + '</td></tr>');
      else {
        const L = r.type === 'chg' ? inl[i].la : r.l ? e(r.l.t) : null;
        const R = r.type === 'chg' ? inl[i].lb : r.r ? e(r.r.t) : null;
        if (L !== null) out.push('<tr' + id + '><td class="ln del">' + r.l.n + '</td><td class="ln del"></td><td class="sg del">−</td><td class="c del">' + L + '</td></tr>');
        if (R !== null) out.push('<tr' + (L === null ? id : '') + '><td class="ln add"></td><td class="ln add">' + r.r.n + '</td><td class="sg add">+</td><td class="c add">' + R + '</td></tr>');
      }
    }
  }
  flushGap();
  out.push('</tbody></table>');
  $('diffwrap').innerHTML = out.join('');
}

function go(k) {
  if (!state.hunks.length) return;
  k = (k + state.hunks.length) % state.hunks.length;
  let el = document.getElementById('h' + k);
  if (!el) return;
  state.cur = k;
  const pos = $('navPos'); if (pos) pos.textContent = (k + 1) + ' / ' + state.hunks.length;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  const h = state.hunks[k];
  let row = el;
  for (let z = h.start; z <= h.end && row; z++) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); row = row.nextElementSibling; }
}

let timer = null;
function schedule() { updateCounts(); if (!$('optAuto').checked) { saveAll(); return; } clearTimeout(timer); timer = setTimeout(runCompare, 450); }

async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { /* ignore */ } ta.remove(); return ok;
  }
}
function readFileInto(file, side) {
  const fr = new FileReader();
  fr.onload = () => { $(side).value = String(fr.result).replace(/^﻿/, ''); toast('Loaded ' + file.name); runCompare(); };
  fr.readAsText(file);
}

const EXAMPLES = {
  dax: [
`Total Sales LY = calculate(sum(Sales[Amount]),sameperiodlastyear('Date'[Date]),Sales[Region]="West")`,
`Total Sales LY =
    CALCULATE(
        SUM(Sales[Amount]),
        SAMEPERIODLASTYEAR('Date'[Date]),
        Sales[Region] = "East",
        Sales[Channel] = "Online"
    )`],
  m: [
`let Source = Sql.Database("srv01", "SalesDB"), #"Filtered Rows" = Table.SelectRows(Source, each [Amount] > 100), #"Changed Type" = Table.TransformColumnTypes(#"Filtered Rows",{{"Amount", type number},{"Date", type date}}) in #"Changed Type"`,
`let
    Source = Sql.Database("srv02", "SalesDB"),
    #"Filtered Rows" = Table.SelectRows(Source, each [Amount] > 500),
    #"Changed Type" = Table.TransformColumnTypes(
        #"Filtered Rows",
        {{"Amount", type number}, {"Date", type date}}
    ),
    #"Removed Columns" = Table.RemoveColumns(#"Changed Type", {"Notes"})
in
    #"Removed Columns"`],
  sql: [
`select c.customer_id, c.name, sum(o.amount) as total from customers c inner join orders o on o.customer_id = c.customer_id where o.order_date >= '2024-01-01' group by c.customer_id, c.name order by total desc`,
`SELECT
    c.customer_id,
    c.name,
    c.city,
    SUM(o.amount) AS total
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.customer_id
WHERE o.order_date >= '2025-01-01'
GROUP BY c.customer_id, c.name, c.city
ORDER BY total DESC`],
  text: [
`Hi team,
The report will be refreshed every Monday at 9 AM.
Please send your inputs by Friday.
Thanks,
Rahul`,
`Hi team,
The report will be refreshed every Monday at 10 AM.
Please send your inputs by Thursday.

Thanks and regards,
Rahul`]
};

function init() {
  loadAll(); updateCounts();
  $('btnCompare').onclick = runCompare;
  $('btnFormat').onclick = () => {
    const { L, R, lang } = prepare();
    $('left').value = L; $('right').value = R; toast('Both boxes formatted as ' + LANG_NAME[lang]); runCompare();
  };
  $('btnSwap').onclick = () => { const t = $('left').value; $('left').value = $('right').value; $('right').value = t; runCompare(); };
  $('btnClear').onclick = () => { $('left').value = ''; $('right').value = ''; runCompare(); $('left').focus(); };
  $('btnTheme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('theme', t); };
  $('btnInputs').onclick = () => { const s = $('inputs').classList.toggle('hidden'); $('btnInputs').textContent = s ? 'Show inputs' : 'Hide inputs'; };
  $('example').onchange = () => {
    const ex = EXAMPLES[$('example').value]; if (!ex) return;
    $('left').value = ex[0]; $('right').value = ex[1]; $('lang').value = 'auto'; $('example').value = ''; runCompare();
  };
  for (const id of ['lang', 'view', ...OPT_IDS]) $(id).addEventListener('change', () => { state.expandAll = false; runCompare(); });
  for (const side of ['left', 'right']) {
    const ta = $(side);
    ta.addEventListener('input', schedule);
    ta.addEventListener('keydown', ev => {
      if (ev.key === 'Tab' && !ev.ctrlKey && !ev.altKey) {
        ev.preventDefault();
        const s = ta.selectionStart, en = ta.selectionEnd;
        ta.setRangeText('    ', s, en, 'end'); schedule();
      }
    });
    ta.addEventListener('dragover', ev => { ev.preventDefault(); ta.classList.add('drag'); });
    ta.addEventListener('dragleave', () => ta.classList.remove('drag'));
    ta.addEventListener('drop', ev => {
      ta.classList.remove('drag');
      const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      if (f) { ev.preventDefault(); readFileInto(f, side); }
    });
  }
  let openSide = 'left';
  document.querySelectorAll('[data-open]').forEach(btn => btn.onclick = () => { openSide = btn.dataset.open; $('fileInput').value = ''; $('fileInput').click(); });
  $('fileInput').onchange = () => { const f = $('fileInput').files[0]; if (f) readFileInto(f, openSide); };
  document.querySelectorAll('[data-copy]').forEach(btn => btn.onclick = async () => {
    const side = btn.dataset.copy;
    if (!state.formatted[side] && $(side).value) runCompare();
    toast(await copyText(state.formatted[side] || '') ? 'Formatted ' + side + ' copied' : 'Copy failed');
  });
  $('changeList').addEventListener('click', ev => { const li = ev.target.closest('li[data-h]'); if (li) go(+li.dataset.h); });
  $('diffwrap').addEventListener('click', ev => { if (ev.target.closest('tr.gap')) { state.expandAll = true; runCompare(); } });
  document.addEventListener('keydown', ev => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); runCompare(); }
    if (ev.altKey && ev.key === 'ArrowDown') { ev.preventDefault(); go(state.cur + 1); }
    if (ev.altKey && ev.key === 'ArrowUp') { ev.preventDefault(); go(state.cur - 1); }
  });
  runCompare();
}
init();
</script>
</body>
